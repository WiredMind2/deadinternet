[project]
name = "deadinternet"
version = "0.1.0"
description = "Local lab for short vertical video experiments"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "langchain>=1.0",
  "langchain-openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deadinternet.propose" = ["slop.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=deadinternet --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["deadinternet"]

[tool.coverage.report]
fail_under = 85
show_missing = true
